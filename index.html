<!DOCTYPE html>
<html lang="vi" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Web Học Tập - Đánh Dấu & Phóng To Tài Liệu</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Chống cuộn trang mặc định của trình duyệt */
        body, html {
            touch-action: none;
            overflow: hidden;
            height: 100%;
            user-select: none;
            -webkit-user-select: none;
        }

        /* --- VIỀN GRADIENT CHUYỂN ĐỘNG --- */
        @keyframes gradient-border-spin {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .gradient-border-wrapper {
            position: relative;
            border-radius: 1.25rem;
            padding: 1.5px;
            background: linear-gradient(90deg, #6366f1, #a855f7, #ec4899, #3b82f6, #6366f1);
            background-size: 300% 300%;
            animation: gradient-border-spin 6s ease infinite;
        }

        .gradient-border-content {
            background-color: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 1.15rem;
        }

        /* --- HIỆU ỨNG SHINE (ÁNH KIM BẢNG ĐIỀU KHIỂN) --- */
        @keyframes shine-sweep {
            0% { transform: translateX(-150%) skewX(-20deg); }
            40%, 100% { transform: translateX(250%) skewX(-20deg); }
        }

        .shine-effect {
            position: relative;
            overflow: hidden;
        }

        .shine-effect::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 45%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.18),
                transparent
            );
            pointer-events: none;
            animation: shine-sweep 5s infinite ease-in-out;
        }

        /* Hiệu ứng mượt cho các nút */
        .btn-mode.active {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: #ffffff;
            box-shadow: 0 0 16px rgba(99, 102, 241, 0.5);
        }

        .cursor-grab { cursor: grab; }
        .cursor-grabbing { cursor: grabbing; }
        .cursor-draw { cursor: crosshair; }
    </style>
</head>
<body class="flex flex-col h-full font-sans antialiased bg-slate-950 select-none">

    <!-- Thanh Tiêu Đề (Header) -->
    <header class="flex items-center justify-between px-3 py-2 bg-slate-900/90 border-b border-indigo-500/30 z-30 shadow-lg backdrop-blur-md">
        <div class="flex items-center gap-2">
            <div class="p-1.5 bg-gradient-to-r from-indigo-500 to-purple-600 rounded-xl text-white shadow-md shadow-indigo-500/20">
                <i data-lucide="book-open" class="w-5 h-5"></i>
            </div>
            <div>
                <h1 class="font-bold text-xs sm:text-sm bg-gradient-to-r from-white via-slate-200 to-indigo-200 bg-clip-text text-transparent leading-tight">Học Tập & Chú Thích</h1>
                <p class="text-[10px] sm:text-xs text-slate-400">Tài liệu tương tác trực tuyến</p>
            </div>
        </div>

        <!-- Chế độ làm việc: VẼ vs PHÓNG TO / DỊCH CHUYỂN -->
        <div class="flex items-center bg-slate-950/80 p-1 rounded-2xl border border-slate-800 shadow-inner">
            <button id="modeDraw" class="btn-mode active flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-semibold text-slate-400 transition-all">
                <i data-lucide="edit-3" class="w-4 h-4"></i>
                <span>Vẽ & Chú thích</span>
            </button>
            <button id="modeZoom" class="btn-mode flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-semibold text-slate-400 transition-all">
                <i data-lucide="move" class="w-4 h-4"></i>
                <span>Phóng to / Di chuyển</span>
            </button>
        </div>

        <!-- Thao tác nhanh -->
        <div class="flex items-center gap-1.5">
            <button id="btnResetZoom" title="Khôi phục kích thước chuẩn" class="p-2 bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-300 rounded-xl text-xs font-medium transition-all border border-slate-700/50 shadow">
                <i data-lucide="maximize-2" class="w-4 h-4"></i>
            </button>
            <button id="btnExport" title="Tải trang hiện tại về máy" class="flex items-center gap-1 px-3 py-1.5 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 active:scale-95 text-white text-xs font-semibold rounded-xl transition-all shadow-md shadow-emerald-900/30">
                <i data-lucide="download" class="w-4 h-4"></i>
                <span class="hidden md:inline">Tải về</span>
            </button>
        </div>
    </header>

    <!-- Khu Vực Hiển Thị Canvas (Viewport) -->
    <main id="viewport" class="flex-1 relative overflow-hidden bg-slate-950 flex items-center justify-center cursor-draw">
        <!-- Loader Hiển thị khi chuyển trang -->
        <div id="loader" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-950/80 backdrop-blur-md z-40 transition-opacity duration-300">
            <div class="w-10 h-10 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
            <p class="mt-3 text-xs font-medium text-indigo-300">Đang tải trang tài liệu...</p>
        </div>

        <!-- Container chứa Canvas để áp dụng Thu phóng & Di chuyển -->
        <div id="transformContainer" class="absolute origin-0 top-0 left-0">
            <canvas id="mainCanvas" class="block rounded-lg shadow-2xl border border-slate-800/80 bg-slate-900"></canvas>
        </div>
    </main>

    <!-- THANH CÔNG CỤ VẼ & ĐÁNH DẤU (Gradient Border + Shine Effect) -->
    <div id="drawingToolbar" class="fixed bottom-20 left-1/2 -translate-x-1/2 z-30 transition-all duration-300 max-w-[95vw]">
        <div class="gradient-border-wrapper shadow-2xl">
            <div class="gradient-border-content shine-effect flex items-center gap-2 p-2 overflow-x-auto">
                <!-- Công cụ vẽ -->
                <div class="flex items-center bg-slate-900/90 p-1 rounded-xl border border-slate-800">
                    <button id="toolPen" title="Bút Thường" class="tool-btn flex items-center justify-center p-2 rounded-lg text-white bg-indigo-600 transition-all shadow-sm">
                        <i data-lucide="pen-tool" class="w-4 h-4"></i>
                    </button>
                    <button id="toolHighlight" title="Bút Đánh Dấu (Highlight)" class="tool-btn flex items-center justify-center p-2 rounded-lg text-slate-400 hover:text-white transition-all">
                        <i data-lucide="highlighter" class="w-4 h-4"></i>
                    </button>
                    <button id="toolEraser" title="Tẩy / Xóa nét" class="tool-btn flex items-center justify-center p-2 rounded-lg text-slate-400 hover:text-white transition-all">
                        <i data-lucide="eraser" class="w-4 h-4"></i>
                    </button>
                </div>

                <div class="h-5 w-px bg-slate-700/60"></div>

                <!-- Chọn Màu Nét Vẽ -->
                <div id="colorPickerGroup" class="flex items-center gap-1.5 px-1">
                    <button data-color="#ef4444" class="color-btn w-6 h-6 rounded-full bg-red-500 ring-2 ring-white scale-110 transition-transform shadow"></button>
                    <button data-color="#eab308" class="color-btn w-6 h-6 rounded-full bg-yellow-500 hover:scale-105 transition-transform shadow"></button>
                    <button data-color="#22c55e" class="color-btn w-6 h-6 rounded-full bg-green-500 hover:scale-105 transition-transform shadow"></button>
                    <button data-color="#3b82f6" class="color-btn w-6 h-6 rounded-full bg-blue-500 hover:scale-105 transition-transform shadow"></button>
                    <button data-color="#a855f7" class="color-btn w-6 h-6 rounded-full bg-purple-500 hover:scale-105 transition-transform shadow"></button>
                    <button data-color="#ffffff" class="color-btn w-6 h-6 rounded-full bg-white hover:scale-105 transition-transform shadow"></button>
                </div>

                <div class="h-5 w-px bg-slate-700/60"></div>

                <!-- Size Nét Vẽ -->
                <div class="flex items-center gap-2 px-1">
                    <i data-lucide="circle-dot" class="w-3.5 h-3.5 text-slate-400"></i>
                    <input type="range" id="brushSize" min="2" max="40" value="4" class="w-16 h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-indigo-500">
                    <span id="brushSizeValue" class="text-xs font-mono text-indigo-300 w-4 font-bold">4</span>
                </div>

                <div class="h-5 w-px bg-slate-700/60"></div>

                <!-- Hoàn tác & Xóa tất cả -->
                <div class="flex items-center gap-1">
                    <button id="btnUndo" title="Hoàn tác (Ctrl+Z)" class="p-2 rounded-xl bg-slate-800/90 hover:bg-slate-700 text-slate-200 transition-colors active:scale-95 border border-slate-700/50">
                        <i data-lucide="undo-2" class="w-4 h-4"></i>
                    </button>
                    <button id="btnClear" title="Xóa toàn bộ nét trên trang" class="p-2 rounded-xl bg-rose-950/80 hover:bg-rose-900 text-rose-300 transition-colors active:scale-95 border border-rose-800/40">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- CỤM NÚT CHUYỂN TRANG (Gradient Border + Shine) -->
    <div class="fixed bottom-4 right-4 sm:bottom-6 sm:right-6 z-30">
        <div class="gradient-border-wrapper shadow-2xl">
            <div class="gradient-border-content shine-effect flex items-center gap-2 p-1.5">
                <button id="btnPrev" class="p-2 rounded-xl bg-slate-800/80 hover:bg-indigo-600 disabled:opacity-30 disabled:hover:bg-slate-800 text-white transition-all active:scale-95">
                    <i data-lucide="chevron-left" class="w-5 h-5"></i>
                </button>

                <div class="flex items-center gap-1 px-1 text-xs sm:text-sm font-semibold">
                    <select id="pageSelect" class="bg-slate-950/80 text-indigo-300 font-mono py-1 px-2 rounded-lg border border-indigo-500/30 focus:outline-none focus:border-indigo-500 cursor-pointer">
                        <option value="1">Trang 1</option>
                        <option value="2">Trang 2</option>
                        <option value="3">Trang 3</option>
                        <option value="4">Trang 4</option>
                        <option value="5">Trang 5</option>
                    </select>
                    <span class="text-slate-400 font-mono">/ 5</span>
                </div>

                <button id="btnNext" class="p-2 rounded-xl bg-slate-800/80 hover:bg-indigo-600 disabled:opacity-30 disabled:hover:bg-slate-800 text-white transition-all active:scale-95">
                    <i data-lucide="chevron-right" class="w-5 h-5"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Thông báo ngắn (Toast) -->
    <div id="toast" class="fixed top-16 left-1/2 -translate-x-1/2 z-50 hidden px-4 py-2 bg-indigo-600 text-white text-xs font-semibold rounded-full shadow-xl transition-all duration-300 opacity-0 border border-indigo-400/40 backdrop-blur-md">
        Cập nhật thành công!
    </div>

    <script>
        // --- 1. KHỞI TẠO CẤU HÌNH & TRẠNG THÁI ---
        const TOTAL_PAGES = 5;
        const BASE_URL = "https://raw.githubusercontent.com/TheFish-cyber/Netking/refs/heads/main/Trang";

        let currentPage = 1;
        let activeMode = 'draw'; // 'draw' hoặc 'zoom'
        let currentTool = 'pen'; // 'pen', 'highlight', 'eraser'
        let currentColor = '#ef4444';
        let currentSize = 4;

        // Trạng thái Thu phóng & Di chuyển chuẩn hóa
        let scale = 1;
        let panX = 0;
        let panY = 0;
        let isPanning = false;
        let startTouchX = 0;
        let startTouchY = 0;

        // Trạng thái Vẽ
        let isDrawing = false;

        // Lưu trữ nét vẽ riêng cho từng trang
        const pageDrawings = {};
        for (let i = 1; i <= TOTAL_PAGES; i++) pageDrawings[i] = [];

        // Cache ảnh
        const imageCache = {};

        // DOM Elements
        const viewport = document.getElementById('viewport');
        const transformContainer = document.getElementById('transformContainer');
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        const loader = document.getElementById('loader');

        const modeDrawBtn = document.getElementById('modeDraw');
        const modeZoomBtn = document.getElementById('modeZoom');
        const drawingToolbar = document.getElementById('drawingToolbar');

        const btnPrev = document.getElementById('btnPrev');
        const btnNext = document.getElementById('btnNext');
        const pageSelect = document.getElementById('pageSelect');
        const btnResetZoom = document.getElementById('btnResetZoom');
        const btnUndo = document.getElementById('btnUndo');
        const btnClear = document.getElementById('btnClear');
        const btnExport = document.getElementById('btnExport');

        const toolPen = document.getElementById('toolPen');
        const toolHighlight = document.getElementById('toolHighlight');
        const toolEraser = document.getElementById('toolEraser');
        const brushSizeInput = document.getElementById('brushSize');
        const brushSizeValue = document.getElementById('brushSizeValue');

        lucide.createIcons();

        // --- 2. CHUYỂN ĐỔI CHẾ ĐỘ (VẼ / PHÓNG TO) ---
        function setInteractionMode(mode) {
            activeMode = mode;
            if (mode === 'draw') {
                modeDrawBtn.classList.add('active');
                modeZoomBtn.classList.remove('active');
                viewport.className = "flex-1 relative overflow-hidden bg-slate-950 flex items-center justify-center cursor-draw";
                drawingToolbar.style.opacity = '1';
                drawingToolbar.style.pointerEvents = 'auto';
            } else {
                modeZoomBtn.classList.add('active');
                modeDrawBtn.classList.remove('active');
                viewport.className = "flex-1 relative overflow-hidden bg-slate-950 flex items-center justify-center cursor-grab";
                drawingToolbar.style.opacity = '0.5';
                drawingToolbar.style.pointerEvents = 'none';
            }
        }

        modeDrawBtn.addEventListener('click', () => setInteractionMode('draw'));
        modeZoomBtn.addEventListener('click', () => setInteractionMode('zoom'));

        // --- 3. TOÁN HỌC PAN & ZOOM CHUẨN XÁC ---
        function applyTransform() {
            transformContainer.style.transform = `translate3d(${panX}px, ${panY}px, 0px) scale(${scale})`;
        }

        function centerCanvas() {
            if (!canvas.displayWidth) return;
            const vw = viewport.clientWidth;
            const vh = viewport.clientHeight;
            panX = (vw - canvas.displayWidth * scale) / 2;
            panY = (vh - canvas.displayHeight * scale) / 2;
            applyTransform();
        }

        function resetZoom() {
            scale = 1;
            centerCanvas();
        }

        btnResetZoom.addEventListener('click', resetZoom);

        // Zoom bằng con trỏ chuột tại vị trí con trỏ
        viewport.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomFactor = 1.12;
            let newScale = e.deltaY < 0 ? scale * zoomFactor : scale / zoomFactor;
            newScale = Math.min(Math.max(0.4, newScale), 6);

            const rect = viewport.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            panX = mouseX - (mouseX - panX) * (newScale / scale);
            panY = mouseY - (mouseY - panY) * (newScale / scale);
            scale = newScale;

            applyTransform();
        }, { passive: false });

        // Xử lý Cảm ứng Pinch-to-zoom & Pan di chuyển
        let touchStartDist = 0;
        let startScale = 1;

        function getTouchDist(e) {
            return Math.hypot(
                e.touches[0].clientX - e.touches[1].clientX,
                e.touches[0].clientY - e.touches[1].clientY
            );
        }

        viewport.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                // 2 Ngón tay -> Tự động zoom kể cả ở Draw mode
                touchStartDist = getTouchDist(e);
                startScale = scale;
            } else if (e.touches.length === 1 && activeMode === 'zoom') {
                isPanning = true;
                startTouchX = e.touches[0].clientX - panX;
                startTouchY = e.touches[0].clientY - panY;
                viewport.classList.replace('cursor-grab', 'cursor-grabbing');
            }
        }, { passive: false });

        viewport.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2 && touchStartDist > 0) {
                e.preventDefault();
                const dist = getTouchDist(e);
                const newScale = Math.min(Math.max(0.4, startScale * (dist / touchStartDist)), 6);
                
                const rect = viewport.getBoundingClientRect();
                const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2 - rect.left;
                const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2 - rect.top;

                panX = midX - (midX - panX) * (newScale / scale);
                panY = midY - (midY - panY) * (newScale / scale);
                scale = newScale;

                applyTransform();
            } else if (e.touches.length === 1 && isPanning && activeMode === 'zoom') {
                e.preventDefault();
                panX = e.touches[0].clientX - startTouchX;
                panY = e.touches[0].clientY - startTouchY;
                applyTransform();
            }
        }, { passive: false });

        viewport.addEventListener('touchend', (e) => {
            if (e.touches.length < 2) touchStartDist = 0;
            if (e.touches.length === 0) {
                isPanning = false;
                viewport.classList.replace('cursor-grabbing', 'cursor-grab');
            }
        });

        // Pan bằng kéo chuột PC
        viewport.addEventListener('mousedown', (e) => {
            if (activeMode === 'zoom' && e.button === 0) {
                isPanning = true;
                startTouchX = e.clientX - panX;
                startTouchY = e.clientY - panY;
                viewport.classList.replace('cursor-grab', 'cursor-grabbing');
            }
        });

        window.addEventListener('mousemove', (e) => {
            if (isPanning && activeMode === 'zoom') {
                panX = e.clientX - startTouchX;
                panY = e.clientY - startTouchY;
                applyTransform();
            }
        });

        window.addEventListener('mouseup', () => {
            if (isPanning) {
                isPanning = false;
                viewport.classList.replace('cursor-grabbing', 'cursor-grab');
            }
        });

        // --- 4. LOAD ANH VÀ KHỞI TẠO NỀN ---
        function setupCanvasSize(img) {
            const vw = viewport.clientWidth;
            const vh = viewport.clientHeight;

            const imgWidth = img.naturalWidth || 1000;
            const imgHeight = img.naturalHeight || 1400;

            const ratio = Math.min((vw - 32) / imgWidth, (vh - 32) / imgHeight, 1);

            const displayWidth = Math.floor(imgWidth * ratio);
            const displayHeight = Math.floor(imgHeight * ratio);

            canvas.style.width = `${displayWidth}px`;
            canvas.style.height = `${displayHeight}px`;

            const dpr = window.devicePixelRatio || 1;
            canvas.width = displayWidth * dpr;
            canvas.height = displayHeight * dpr;
            ctx.scale(dpr, dpr);

            canvas.displayWidth = displayWidth;
            canvas.displayHeight = displayHeight;

            centerCanvas();
            redrawCanvas();
        }

        function loadPage(pageNumber) {
            loader.style.opacity = '1';
            loader.classList.remove('hidden');

            currentPage = pageNumber;
            pageSelect.value = currentPage;

            btnPrev.disabled = currentPage === 1;
            btnNext.disabled = currentPage === TOTAL_PAGES;

            const imageUrl = `${BASE_URL}${currentPage}.webp`;

            if (imageCache[currentPage]) {
                setupCanvasSize(imageCache[currentPage]);
                hideLoader();
            } else {
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.src = imageUrl;

                img.onload = () => {
                    imageCache[currentPage] = img;
                    setupCanvasSize(img);
                    hideLoader();
                };

                img.onerror = () => {
                    showToast('Không nạp được ảnh! Tạo trang chuẩn.');
                    const dummyCanvas = document.createElement('canvas');
                    dummyCanvas.width = 800;
                    dummyCanvas.height = 1150;
                    const dCtx = dummyCanvas.getContext('2d');
                    dCtx.fillStyle = '#0f172a';
                    dCtx.fillRect(0, 0, 800, 1150);
                    dCtx.fillStyle = '#818cf8';
                    dCtx.font = 'bold 36px sans-serif';
                    dCtx.textAlign = 'center';
                    dCtx.fillText(`TÀI LIỆU HỌC TẬP - TRANG ${currentPage}`, 400, 575);

                    const dummyImg = new Image();
                    dummyImg.src = dummyCanvas.toDataURL();
                    dummyImg.onload = () => {
                        imageCache[currentPage] = dummyImg;
                        setupCanvasSize(dummyImg);
                        hideLoader();
                    };
                };
            }
        }

        function hideLoader() {
            setTimeout(() => {
                loader.style.opacity = '0';
                setTimeout(() => loader.classList.add('hidden'), 300);
            }, 100);
        }

        // --- 5. HỆ THỐNG VẼ CỰC NHẠY ---
        function redrawCanvas() {
            if (!canvas.displayWidth) return;

            ctx.clearRect(0, 0, canvas.displayWidth, canvas.displayHeight);

            const img = imageCache[currentPage];
            if (img) {
                ctx.drawImage(img, 0, 0, canvas.displayWidth, canvas.displayHeight);
            }

            const paths = pageDrawings[currentPage] || [];
            paths.forEach(path => drawPath(path));
        }

        function drawPath(path) {
            if (!path.points || path.points.length < 1) return;

            ctx.save();
            ctx.beginPath();
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            if (path.tool === 'eraser') {
                ctx.globalCompositeOperation = 'destination-out';
                ctx.lineWidth = path.size * 1.8;
            } else if (path.tool === 'highlight') {
                ctx.globalCompositeOperation = 'source-over';
                ctx.strokeStyle = path.color;
                ctx.globalAlpha = 0.38;
                ctx.lineWidth = path.size * 2.8;
            } else {
                ctx.globalCompositeOperation = 'source-over';
                ctx.strokeStyle = path.color;
                ctx.globalAlpha = 1.0;
                ctx.lineWidth = path.size;
            }

            const p0 = path.points[0];
            ctx.moveTo(p0.x * canvas.displayWidth, p0.y * canvas.displayHeight);

            for (let i = 1; i < path.points.length; i++) {
                const pt = path.points[i];
                ctx.lineTo(pt.x * canvas.displayWidth, pt.y * canvas.displayHeight);
            }
            ctx.stroke();
            ctx.restore();
        }

        // Chuyển tọa độ màn hình/chạm sang tọa độ chuẩn Canvas (bất kể Zoom/Pan)
        function getCanvasCoordinates(e) {
            const canvasRect = canvas.getBoundingClientRect();
            let clientX = e.clientX;
            let clientY = e.clientY;

            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            }

            const x = (clientX - canvasRect.left) / canvasRect.width;
            const y = (clientY - canvasRect.top) / canvasRect.height;

            return { x: Math.max(0, Math.min(1, x)), y: Math.max(0, Math.min(1, y)) };
        }

        function startDrawing(e) {
            if (activeMode !== 'draw' || e.button > 0) return;
            isDrawing = true;

            const coords = getCanvasCoordinates(e);
            const newPath = {
                tool: currentTool,
                color: currentColor,
                size: currentSize,
                points: [coords]
            };

            pageDrawings[currentPage].push(newPath);
            redrawCanvas();
        }

        function draw(e) {
            if (!isDrawing || activeMode !== 'draw') return;
            const coords = getCanvasCoordinates(e);
            const paths = pageDrawings[currentPage];
            if (paths.length > 0) {
                paths[paths.length - 1].points.push(coords);
                requestAnimationFrame(redrawCanvas);
            }
        }

        function stopDrawing() {
            isDrawing = false;
        }

        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        window.addEventListener('mouseup', stopDrawing);

        canvas.addEventListener('touchstart', (e) => {
            if (activeMode === 'draw' && e.touches.length === 1) {
                startDrawing(e);
            }
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            if (activeMode === 'draw' && e.touches.length === 1) {
                e.preventDefault();
                draw(e);
            }
        }, { passive: false });

        canvas.addEventListener('touchend', stopDrawing);

        // --- 6. CÁC NÚT ĐIỀU KHIỂN & BẢNG MÀU ---
        function setTool(tool) {
            currentTool = tool;
            [toolPen, toolHighlight, toolEraser].forEach(btn => {
                btn.classList.remove('bg-indigo-600', 'text-white', 'shadow-sm');
                btn.classList.add('text-slate-400');
            });

            if (tool === 'pen') toolPen.classList.add('bg-indigo-600', 'text-white', 'shadow-sm');
            if (tool === 'highlight') toolHighlight.classList.add('bg-indigo-600', 'text-white', 'shadow-sm');
            if (tool === 'eraser') toolEraser.classList.add('bg-indigo-600', 'text-white', 'shadow-sm');
        }

        toolPen.addEventListener('click', () => setTool('pen'));
        toolHighlight.addEventListener('click', () => setTool('highlight'));
        toolEraser.addEventListener('click', () => setTool('eraser'));

        document.querySelectorAll('.color-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('ring-2', 'ring-white', 'scale-110'));
                btn.classList.add('ring-2', 'ring-white', 'scale-110');
                currentColor = btn.getAttribute('data-color');
                if (currentTool === 'eraser') setTool('pen');
            });
        });

        brushSizeInput.addEventListener('input', (e) => {
            currentSize = parseInt(e.target.value);
            brushSizeValue.textContent = currentSize;
        });

        btnUndo.addEventListener('click', () => {
            if (pageDrawings[currentPage].length > 0) {
                pageDrawings[currentPage].pop();
                redrawCanvas();
            }
        });

        btnClear.addEventListener('click', () => {
            if (pageDrawings[currentPage].length > 0) {
                pageDrawings[currentPage] = [];
                redrawCanvas();
                showToast('Đã xóa toàn bộ nét vẽ trang này');
            }
        });

        btnExport.addEventListener('click', () => {
            const a = document.createElement('a');
            a.download = `TaiLieu_Trang_${currentPage}.png`;
            a.href = canvas.toDataURL('image/png');
            a.click();
            showToast('Đã tải trang ghi chú thành công!');
        });

        // --- 7. CHUYỂN TRANG & PHÍM TẮT ---
        btnPrev.addEventListener('click', () => { if (currentPage > 1) loadPage(currentPage - 1); });
        btnNext.addEventListener('click', () => { if (currentPage < TOTAL_PAGES) loadPage(currentPage + 1); });
        pageSelect.addEventListener('change', (e) => loadPage(parseInt(e.target.value)));

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' && currentPage > 1) loadPage(currentPage - 1);
            if (e.key === 'ArrowRight' && currentPage < TOTAL_PAGES) loadPage(currentPage + 1);
            if (e.ctrlKey && e.key.toLowerCase() === 'z') btnUndo.click();
        });

        window.addEventListener('resize', () => {
            if (imageCache[currentPage]) setupCanvasSize(imageCache[currentPage]);
        });

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('opacity-100'), 10);
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                setTimeout(() => toast.classList.add('hidden'), 300);
            }, 2500);
        }

        // --- BẮT ĐẦU ỨNG DỤNG ---
        setInteractionMode('draw');
        setTool('pen');
        loadPage(1);
    </script>
</body>
</html>
